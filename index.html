<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>艺术博物馆 · 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>艺术博物馆</h1>
      <p class="hint desktop-hint">点击画面锁定鼠标 · <kbd>W A S D</kbd> 移动 · 靠近门按 <kbd>E</kbd> 切换展厅</p>
      <p class="hint mobile-hint">拖动屏幕环顾四周 · 使用摇杆移动 · 靠近门点按进入</p>
      <p class="prompt" id="doorPrompt" hidden>按 <kbd>E</kbd> 进入下一展厅</p>
      <p class="prompt mobile-prompt" id="doorPromptMobile" hidden>点按进入下一展厅</p>
      <p class="gallery" id="galleryLabel"></p>
    </div>
    <button id="bodyToggle" title="显示/隐藏人物">👤</button>
    <div id="blocker">
      <div class="blocker-inner">
        <p>点击进入展厅空间</p>
        <p class="sub">沉浸式浏览 · Three.js</p>
      </div>
    </div>

    <!-- 手机触控 UI -->
    <div id="mobileControls">
      <!-- 虚拟摇杆区域 -->
      <div id="joystickZone">
        <div id="joystickBase">
          <div id="joystickThumb"></div>
        </div>
      </div>
      <!-- 右侧操作按钮 -->
      <div id="actionButtons">
        <button id="doorBtn" class="action-btn" hidden>
          <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M10 4v2h4v10h-4v2h4a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-2.8 5.4L5.2 11.4l2 2-1.4 1.4L1.4 11l4.4-4.4z"/></svg>
        </button>
        <button id="lookBtn" class="action-btn toggle-btn" title="环顾四周">
          <svg viewBox="0 0 24 24" width="28" height="28"><circle fill="currentColor" cx="12" cy="12" r="10" opacity="0.2"/><circle fill="currentColor" cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <!-- 移动端提示 -->
      <div id="mobileToast" class="mobile-toast" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
