<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Art Museum · 沉浸式 3D 艺术馆</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Art Museum</h1>
      <p class="hint desktop-hint">点击画面锁定鼠标 · <kbd>W A S D</kbd> 移动 · 走进门自动切换展厅 · 左上角 🏛 随时选厅</p>
      <p class="hint mobile-hint">拖动屏幕环顾四周 · 摇杆移动 · 走进门自动切换 · 左上角 🏛 随时选厅</p>
      <p class="gallery" id="galleryLabel"></p>
    </div>
    <button id="bodyToggle" title="显示/隐藏人物">👤</button>
    <button id="galleryMenuBtn" title="选择展厅">🏛</button>

    <!-- 展厅选择菜单 -->
    <div id="gallery-menu" class="gallery-menu">
      <div class="gallery-menu-inner">
        <h2>选择展厅</h2>
        <p class="gallery-menu-sub">点击进入 · 展厅内走进门可继续前进</p>
        <div id="gallery-cards" class="gallery-cards"></div>
      </div>
    </div>

    <div id="blocker" hidden>
      <div class="blocker-inner">
        <p>点击进入展厅空间</p>
        <p class="sub">沉浸式浏览 · Three.js</p>
      </div>
    </div>

    <!-- 手机触控 UI -->
    <div id="mobileControls">
      <!-- 虚拟摇杆区域 -->
      <div id="joystickZone">
        <div id="joystickBase">
          <div id="joystickThumb"></div>
        </div>
      </div>
      <!-- 右侧操作按钮 -->
      <div id="actionButtons">
        <button id="lookBtn" class="action-btn toggle-btn" title="环顾四周">
          <svg viewBox="0 0 24 24" width="28" height="28"><circle fill="currentColor" cx="12" cy="12" r="10" opacity="0.2"/><circle fill="currentColor" cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <!-- 移动端提示 -->
      <div id="mobileToast" class="mobile-toast" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
