<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="沉浸式 3D 虚拟艺术馆 · 40 幅克利夫兰艺术博物馆 CC0 公版画作 · 门厅、主廊与五个展厅" />
    <meta property="og:title" content="Art Museum · 沉浸式 3D 艺术馆" />
    <meta property="og:description" content="走进去，逛一圈。40 幅公版画作，五个展厅。" />
    <meta property="og:type" content="website" />
    <title>Art Museum · 沉浸式 3D 艺术馆</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 极简 HUD：只留馆名和当前所在空间 -->
    <div id="ui">
      <h1>Art Museum</h1>
      <p class="gallery" id="galleryLabel"></p>
    </div>
    <button id="bodyToggle" title="显示/隐藏人物">👤</button>
    <button id="galleryMenuBtn" title="展厅列表">🏛</button>

    <!-- 开场提示，几秒后自动淡出 -->
    <div id="intro-hint" class="intro-hint">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走动 · 鼠标转视角 · <kbd>E</kbd> 看作品 / 坐下 · <kbd>F</kbd> 手电筒</p>
    </div>

    <!-- 可交互提示（桌面上按 E，移动端直接点） -->
    <div id="prompt" class="prompt hidden"></div>

    <!-- 桌面端轻提示 -->
    <div id="toast" class="toast" hidden></div>

    <!-- 画作后台加载进度 -->
    <div id="art-progress" class="art-progress hidden"></div>

    <!-- 作品详情浮层 -->
    <div id="art-detail" class="art-detail hidden">
      <div class="art-detail-card">
        <button id="detail-close" class="detail-close" title="关闭">✕</button>
        <div class="detail-figure"><img id="detail-img" alt="" /></div>
        <div class="detail-meta">
          <h2 id="detail-title"></h2>
          <p id="detail-artist"></p>
          <p id="detail-year" class="detail-year"></p>
          <a id="detail-link" class="detail-link" target="_blank" rel="noopener">查看馆藏记录 →</a>
        </div>
      </div>
    </div>

    <!-- 展厅列表（跳转用）。默认收起，进门直接看馆内 -->
    <div id="gallery-menu" class="gallery-menu hidden">
      <div class="gallery-menu-inner">
        <h2>展厅列表</h2>
        <p class="gallery-menu-sub">也可以直接走到对应展厅 · 门厅墙上有一张导览图</p>
        <div id="gallery-cards" class="gallery-cards"></div>
      </div>
    </div>

    <!-- 手机触控 UI -->
    <div id="mobileControls">
      <div id="joystickZone">
        <div id="joystickBase">
          <div id="joystickThumb"></div>
        </div>
      </div>
      <div id="actionButtons">
        <button id="flashBtn" class="action-btn toggle-btn" title="手电筒">🔦</button>
        <button id="lookBtn" class="action-btn toggle-btn" title="环顾四周">
          <svg viewBox="0 0 24 24" width="28" height="28"><circle fill="currentColor" cx="12" cy="12" r="10" opacity="0.2"/><circle fill="currentColor" cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="mobileToast" class="mobile-toast" hidden></div>
    </div>

    <!-- 载入提示 -->
    <div id="loading" class="loading hidden">
      <div class="loading-spinner"></div>
      <p class="loading-text">正在开门…</p>
    </div>

    <!-- 启动失败兜底 -->
    <div id="fatal" class="fatal hidden">
      <h2>展馆没能打开</h2>
      <p>平面图加载失败，请刷新重试。</p>
      <p class="fatal-detail"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
